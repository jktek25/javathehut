name: Run API with Maven Pipeline

on:
  push:
    branches:
      - '**'

  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'

permissions: { }

jobs:
  build_and_verify:
    name: Run GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15  # <--- Cancels the entire job if it takes longer than 15 minutes
    permissions:
      contents: read # Required for actions/checkout
      issues: write # Any other permissions you need
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java (v26)
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Setup Install JMeter
        run: |
          echo "Installing JMeter..."
          # sudo apt-get update
          # sudo apt-get install -y jmeter
          JMETER_VERSION=5.6.3
          wget -q \
            https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz
          tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Inspect JMeter
        run: |
          jmeter --version
          ls -l "$(which jmeter)"
          dpkg -l | grep -i jmeter || true
          
      - name: Start API
        run: |
          echo "Starting API..."
          echo "Java:"
          java -version
          echo "Maven:"
          ./mvnw --version

      - name: Build with Maven
        run: |
          echo "Building API..."
          ./mvnw clean package -DskipTests

      - name: Start Spring Boot API
        run: |
          echo "Starting Spring Boot..."
          # ./mvnw clean spring-boot:run &
          # echo $! > api_pid.txt
          java -jar target/CalculatorAPI-1.jar > api.log 2>&1 &
          echo $! > api_pid.txt

          echo "Spring Boot PID:"
          cat api_pid.txt
          sleep 3  # Wait a moment for the API to start

          echo "===== PROCESS ====="
          psgrep aux java || true

          echo "===== PORT 8080 ====="
          ss -ltnp | grep ':8080' || true
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready..."
          for _ in {1..60}; do
            if curl -s http://localhost:8080/api/status | grep '"status":"UP"' > /dev/null; then
              echo "API is ready!"
              exit 0
            fi
            echo "API not ready yet, waiting..."
            sleep 2
          done
          echo "API did not become ready in time."
          exit 1

      - name: Run API Tests
        run: |
          echo "Running API tests..."
          mvn test

      - name: Run JMeter Load Test
        run: |
          echo "Running JMeter load test..."
          mkdir -p report
          jmeter -n -t jmeter/loadTest.jmx -l report/results.jtl

      - name: Upload JMeter Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: report/results.jtl

      - name: Stop API
        run: |
          echo "Stopping API..."
          if [ -f api_pid.txt ]; then
            kill "$( < api_pid.txt)" || true
            rm api_pid.txt
          fi